ce helper for the move-return experiment.","owner":"User-defined state variable storing deployer authority.","faucet":"User-defined variable generally holding the target/authorized Faucet contract or address.","token":"User-defined variable holding a SentinelToken reference.","pass":"User-defined test variable name for SentinelToken; `pass` is not a Solidity keyword.","accomplice":"User-defined address/contract reference for the second participant.","moved":"User-defined local boolean holding the return value of token.transfer.","payer":"User-defined parameter identifying the address to receive the guarded Ether payout.","reason":"User-defined catch parameter containing an Error(string) revert reason.","success":"User-defined boolean conventionally used for low-level call return status.","gasAtStart":"User-defined measurement snapshot.","gasAtEnd":"User-defined measurement snapshot.","gasUsedThisCycle":"User-defined difference between two gasleft() snapshots."},"docs":{"contracts":"https://docs.soliditylang.org/en/v0.8.26/contracts.html","types":"https://docs.soliditylang.org/en/v0.8.26/types.html","control":"https://docs.soliditylang.org/en/v0.8.26/control-structures.html","globals":"https://docs.soliditylang.org/en/v0.8.26/units-and-global-variables.html","layout":"https://docs.soliditylang.org/en/v0.8.26/layout-of-source-files.html","remix":"https://remix-ide.readthedocs.io/en/latest/unittesting.html","hardhat":"https://remix-ide.readthedocs.io/en/latest/hardhat.html","spdx":"https://spdx.dev/learn/handling-license-info/"},"traces":[{"name":"Experiment 1 — Normal Reentrancy","steps":[["FaucetAttacker.attack()","attacker.sol",19],["Faucet.withdraw()","faucet3-vulnerable.sol",15],["Ether .call","faucet3-vulnerable.sol",20],["FaucetAttacker.receive()","attacker.sol",25],["nested withdraw","attacker.sol",34],["Vulnerable repeats / protected path rejects reentry","Faucet3Mutex.sol",15]]},{"name":"Experiment 2 — Cross-Contract Token Movement","steps":[["TokenMoveAttack .sol",36],["subtract snapshots","gas_test.sol",37],["repeat same boundary idea for each path","gas_test.sol",56],["compare normal vs late detect vs early prevent","gas_test.sol",123]]}],"stats":{"files":14,"lines":1084,"blocks":117,"high":80}}</script><script id="roseData" type="application/json">[{"id":1,"file":"IERC20Light.sol","line":5,"q":{"ja":"`transfer` が `returns (bool)` を持つ主な意味は？","en":"Why does `transfer` declare `returns (bool)`?"},"options":[{"ja":"呼び出し側が移動成功/拒否を判定できる","en":"So the caller can tell whether the move succeeded or was refused"},{"ja":"transfer時に必ずeventを発火させる","en":"To force an event on every transfer"},{"ja":"Ether送金額を返す","en":"To return the Ether amount sent"},{"ja":"interfaceをdeploy可能にする","en":"To make the interface deployable"}],"correct":0,"explain":{"ja":"この研究では学習後のtransferがrevertではなくfalseを返し、TokenMoveAttackerがpassMoveBlockedを記録する。","en":"After learning, the token can return false instead of reverting, and TokenMoveAttacker records that as passMoveBlocked."}},{"id":2,"file":"IERC20Light.sol","line":6,"q":{"ja":"`indexed` は何を指定している？","en":"What does `indexed` specify in the event declaration?"},"options":[{"ja":"event parameterをlog topicとして検索しやすくする","en":"It makes the event parameter a log topic that is easier to filter"},{"ja":"addressをimmutableにする","en":"It makes the address immutable"},{"ja":"eventをstorageへ保存する","en":"It stores the event in contract storage"},{"ja":"transferをexternalにする","en":"It makes transfer external"}],"correct":0,"explain":{"ja":"`indexed` はevent parameter modifierで、名前ではなくSolidityの固定語。","en":"`indexed` is an event-parameter modifier and a fixed Solidity keyword."}},{"id":3,"file":"IFaucet.sol","line":5,"q":{"ja":"Attackerが完全なFaucet実装ではなく`IFaucet`だけを持てばよい理由は？","en":"Why can the attacker use only `IFaucet` instead of the full Faucet implementation?"},"options":[{"ja":"呼びたい`withdraw(uint)`の署名だけ分かれば外部callできる","en":"It only needs the signature of `withdraw(uint)` to make the external call"},{"ja":"interfaceはFaucetのstorageをコピーするから","en":"The interface copies Faucet storage"},{"ja":"IFaucetがmutexを自動付与するから","en":"IFaucet automatically adds a mutex"},{"ja":"interfaceがFaucet残高を保持するから","en":"The interface holds the Faucet balance"}],"correct":0,"explain":{"ja":"interfaceは相手の「呼び出し可能な形」を宣言する最小モデルで、実装やstorageを複製しない。","en":"An interface is a minimal callable model of the target; it does not copy implementation or storage."}},{"id":4,"file":"faucet3-vulnerable.sol","line":20,"q":{"ja":"Vulnerable Faucetでreentrancyを成立させる決定的な順序は？","en":"Which ordering is decisive for reentrancy in the vulnerable Faucet?"},"options":[{"ja":"Etherを送った後で`claimed`をtrueにする","en":"Send Ether before setting `claimed = true`"},{"ja":"`claimed`をtrueにしてからEtherを送る","en":"Set `claimed = true` before sending Ether"},{"ja":"mutexを解除してからrequireする","en":"Unlock the mutex before require"},{"ja":"PASS transfer後にconstructorを呼ぶ","en":"Call the constructor after PASS transfer"}],"correct":0,"explain":{"ja":"外部call中のcallbackではclaimedがまだfalseなので、同じwithdrawを再び通れる。","en":"During the external call callback, claimed is still false, so another withdraw can pass."}},{"id":5,"file":"faucet3-vulnerable.sol","line":23,"q":{"ja":"`claimed[msg.sender] = true;` をEther送信より前へ移すと最も直接的に何が変わる？","en":"What changes most directly if `claimed[msg.sender] = true;` is moved before the Ether send?"},"options":[{"ja":"CEIのEffectが先になり、同じaddressの再入を止めやすくなる","en":"The Effect happens first, making same-address reentry easier to stop"},{"ja":"FaucetがEtherを受け取れなくなる","en":"The Faucet can no longer receive Ether"},{"ja":"PASS残高が0になる","en":"The PASS balance becomes zero"},{"ja":"msg.senderがAccompliceに変わる","en":"msg.sender changes to the Accomplice"}],"correct":0,"explain":{"ja":"Experiment 1の比較でStandard Defenseが行っている中心的な違い。","en":"This is the core ordering difference used by the Standard Defense in Experiment 1."}},{"id":6,"file":"Faucet3Mutex.sol","line":17,"q":{"ja":"`_ ;`（実コードでは`_;`）はmodifier内で何を表す？","en":"What does `_ ;` (`_;` in the code) represent inside the modifier?"},"options":[{"ja":"modifierを付けた関数本体をここで実行する位置","en":"The point where the body of the modified function executes"},{"ja":"constructorを再実行する位置","en":"The point where the constructor runs again"},{"ja":"revert理由を挿入する位置","en":"The point where a revert reason is inserted"},{"ja":"storageを初期化する位置","en":"The point where storage is initialized"}],"correct":0,"explain":{"ja":"`locked = true`の後、`locked = false`の前に関数本体を置くことで実行中だけlockが有効になる。","en":"Placing the function body between locked=true and locked=false keeps the lock active only during execution."}},{"id":7,"file":"Faucet3Mutex.sol","line":16,"q":{"ja":"`require(!locked, ...)` が失敗するのはいつ？","en":"When does `require(!locked, ...)` fail?"},"options":[{"ja":"保護中の関数へlockがtrueのまま再入したとき","en":"When reentry occurs while the lock is still true"},{"ja":"Faucet残高が0.4 ETHになったとき","en":"When the Faucet balance reaches 0.4 ETH"},{"ja":"PASSを1枚持っているとき","en":"When the caller owns one PASS"},{"ja":"constructor実行時","en":"During constructor execution"}],"correct":0,"explain":{"ja":"mutexは「同じ実行中の保護pathへ戻ること」を止める。後の別transactionまで永久lockするものではない。","en":"The mutex blocks reentry into the protected path while it is executing; it is not a permanent lock across later transactions."}},{"id":8,"file":"Faucet3Mutex.sol","line":35,"q":{"ja":"Standard Defenseで`claimed[msg.sender] = true`を外部callより前に置く理由は？","en":"Why does the Standard Defense set `claimed[msg.sender] = true` before the external call?"},"options":[{"ja":"Checks-Effects-InteractionsのEffectを先に確定するため","en":"To apply the Effect before Interaction under Checks-Effects-Interactions"},{"ja":"console.logを短くするため","en":"To shorten console.log output"},{"ja":"gasleftを増やすため","en":"To increase gasleft"},{"ja":"AccompliceへPASSを移すため","en":"To move PASS to the Accomplice"}],"correct":0,"explain":{"ja":"外部制御を渡す前に重要stateを更新するのがCEI。","en":"CEI updates important state before handing control to an external contract."}},{"id":9,"file":"Accomplice.sol","line":18,"q":{"ja":"Type 2でAccompliceを別contract function renderQuizControls(){let ds=drillsForFile(current);if(!drill||drill.file!==current.name){drill=ds[0]||null;fullFile=false}let files=DATA.files.map(f=>`<option ${f===current?'selected':''}>${esc(f.name)}</option>`).join(''),blocks=ds.map(d=>`<option value="${esc(d.id)}" ${drill&&d.id===drill.id?'selected':''}>L${d.start}-${d.end} · ${esc(d.title)}</option>`).join('');$('#quizControls').innerHTML=`<label>${t('file')}</label><select class="select" id="qFile">${files}</select><label>${t('block')}</label><select class="select" id="qBlock">${blocks}</select><label>${t('display')}</label><select class="select" id="qMode"><option value="copy">${t('copy')}</option><option value="glance">${t('glance')}</option><option value="memory">${t('memoryMode')}</option><option value="cold">${t('cold')}</option></select><label>${t('judge')}</label><select class="select" id="qStrict"><option value="exact">${t('exactMode')}</option><option value="structure">${t('structure')}</option><option value="syntax">${t('syntax')}</option></select><button class="qbtn primary" id="randomHigh">${t('randomHigh')}</button><button class="qbtn" id="randomAny">${t('randomAny')}</button><div class="lead" style="font-size:11px;margin-top:8px">${t('smallNote')}</div><div id="qStats" style="margin-top:9px;font-size:11px;color:#999fb4"></div>`;$('#qFile').onchange=e=>selectFile(e.target.value);$('#qBlock').onchange=e=>{fullFile=false;drill=ds.find(d=>d.id===e.target.value);renderQuiz()};$('#qMode').value=quizMode;$('#qMode').onchange=e=>{quizMode=e.target.value;renderQuiz()};$('#qStrict').value=strict;$('#qStrict').onchange=e=>strict=e.target.value;$('#randomHigh').onclick=()=>randomDrill(true);$('#randomAny').onclick=()=>randomDrill(false);updateStats()}
function randomDrill(high){let pool=allDrills().filter(d=>!high||d.priority==='HIGH');drill=pool[Math.floor(Math.random()*pool.length)];fullFile=false;current=DATA.files.find(f=>f.name===drill.file);renderNav();renderFile();renderBlocks();renderWhy();renderQuizControls();renderQuiz()}
function normalize(s,m){if(m==='structure')return s.split('\n').map(x=>x.replace(/[ \t]+$/,'')).join('\n');if(m==='syntax')return s.replace(/\s+/g,' ').trim();return s}function firstDiff(a,b){let i=0,n=Math.min(a.length,b.length);while(i<n&&a[i]===b[i])i++;let bef=a.slice(0,i),line=bef.split('\n').length,col=i-(bef.lastIndexOf('\n')+1)+1;return{line,col,expected:a.split('\n')[line-1]??'',actual:b.split('\n')[line-1]??''}}
function statKey(){return 'asl3:'+drill.id}function getStat(){try{return JSON.parse(STORE.get(statKey()))||{attempts:0,exact:0,streak:0,best:0}}catch{return{attempts:0,exact:0,streak:0,best:0}}}function updateStats(){if(!drill||!$('#qStats'))return;let s=getStat();$('#qStats').innerHTML=`Attempts <b>${s.attempts}</b> · Exact <b>${s.exact}</b> · Streak <b>${s.streak}</b> · Best <b>${s.best}</b>`}
function renderQuiz(){if(!drill)return;let hide=['memory','cold'].includes(quizMode),n=drill.code.split('\n').length;$('#quizMain').innerHTML=`<div class="targetbox"><div class="targethead"><span>${esc(drill.title)}</span><span>${n} lines · ${drill.code.length} chars</span></div><div id="targetCode" class="targetcode ${hide?'hidden':''}">${esc(drill.code)}</div></div><textarea id="typed" class="typed" spellcheck="false" placeholder="${lang==='ja'?'ここに完全模写…':'Type the exact code here…'}"></textarea><div style="margin-top:8px"><button class="qbtn primary" id="checkQ">${t('check')}</button><button class="qbtn" id="toggleQ">${t('toggle')}</button><button class="qbtn" id="fillQ">${t('fill')}</button><button class="qbtn danger" id="clearQ">${t('clear')}</button></div><div id="qResult"></div>`;let ta=$('#typed');ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ta.setRangeText('    ',ta.selectionStart,ta.selectionEnd,'end')}};$('#toggleQ').onclick=()=>$('#targetCode').classList.toggle('hidden');$('#fillQ').onclick=()=>ta.value=drill.code;$('#clearQ').onclick=()=>{ta.value='';$('#qResult').innerHTML=''};$('#checkQ').onclick=checkQuiz;if(quizMode==='glance')setTimeout(()=>$('#targetCode')?.classList.add('hidden'),5000);updateStats()}
function checkQuiz(){let typed=$('#typed').value,target=drill.code,ok=normalize(target,strict)===normalize(typed,strict),exact=target===typed,s=getStat();s.attempts++;if(exact){s.exact++;s.streak++;s.best=Math.max(s.best,s.streak)}else s.streak=0;STORE.set(statKey(),JSON.stringify(s));updateStats();if(ok)$('#qResult').innerHTML=`<div class="result good"><strong>${exact?'EXACT MATCH ✓':'MATCH ✓'}</strong><br>${lang==='ja'?'指定モードで一致。':'Matched under the selected judgement mode.'}</div>`;else{let d=firstDiff(normalize(target,strict),normalize(typed,strict));$('#qResult').innerHTML=`<div class="result bad"><strong>MISMATCH</strong><br>Line ${d.line}, Column ${d.col}<pre>${esc('Expected: '+d.expected+'\nYou typed: '+d.actual)}</pre></div>`}}
// ROSE MCQ
let roseAnswers={};try{roseAnswers=JSON.parse(STORE.get('asl3-rose')||'{}')}catch{}function roseScore(){let ks=Object.keys(roseAnswers),c=ks.filter(k=>roseAnswers[k]===ROSE[+k-1].correct).length;return[a=ks.length,c]}
function renderRose(){if(!ROSE.length)return;let [answered,correct]=roseScore(),q=ROSE[roseIndex],ans=roseAnswers[q.id];let nums=ROSE.map((x,i)=>{let a=roseAnswers[x.id],cl=i===roseIndex?'active ':'';if(a!==undefined)cl+=(a===x.correct?'correct':'wrong');return `<button class="rose-num ${cl}" data-i="${i}">${i+1}</button>`}).join('');let opts=q.options.map((o,i)=>`<button class="rose-option ${ans===i?'selected '+(i===q.correct?'correct':'wrong'):''}" data-o="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(o[lang])}</span></button>`).join('');$('#roseBox').innerHTML=`<div class="rose-shell"><div class="rose-top"><div class="rose-status"><strong>${t('roseTitle')}</strong><span>${t('question')} ${roseIndex+1}/${ROSE.length}</span><span>${t('answered')}: ${answered}/${ROSE.length}</span><span>${t('correct')}: ${correct}</span></div><div class="rose-numbers">${nums}</div></div><div class="rose-card"><div class="rose-meta">${esc(q.file)} · L${q.line}</div><div class="rose-q">${esc(q.q[lang])}</div><div class="rose-options">${opts}</div>${ans!==undefined?`<div class="rose-feedback"><strong>${ans===q.correct?(lang==='ja'?'正解 ✓':'Correct ✓'):(lang==='ja'?'不正解':'Incorrect')}</strong><br>${esc(q.explain[lang])}</div>`:''}<div class="rose-actions"><button class="qbtn" id="roseJump">${t('jump')}</button><button class="qbtn primary" id="roseNext">${t('next')}</button><button class="qbtn danger" id="roseReset">${t('reset')}</button></div></div></div>`;$$('.rose-num').forEach(x=>x.onclick=()=>{roseIndex=+x.dataset.i;renderRose()});$$('.rose-option').forEach(x=>x.onclick=()=>{roseAnswers[q.id]=+x.dataset.o;STORE.set('asl3-rose',JSON.stringify(roseAnswers));renderRose()});$('#roseNext').onclick=()=>{roseIndex=(roseIndex+1)%ROSE.length;renderRose()};$('#roseJump').onclick=()=>{selectFile(q.file,q.line);switchView('explore')};$('#roseReset').onclick=()=>{if(confirm(lang==='ja'?'ROSE MODEの回答履歴を全部消しますか？':'Reset all ROSE MODE answers?')){roseAnswers={};STORE.remove('asl3-rose');renderRose()}}}
const TRACE_JA=['Experiment 1 — Normal Reentrancy','Experiment 2 — Cross-Contract Token Movement','Experiment 3 — 学習 → Early Prevention','Experiment 4 — False Positive','Experiment 5 — 一般化 + Move-Return','Experiment 6 — Gas測定'];function renderTrace(){let opts=DATA.traces.map((x,i)=>`<option value="${i}">${esc(lang==='ja'?TRACE_JA[i]:x.name)}</option>`).join('');$('#traceSelect').innerHTML=opts;$('#traceSelect').onchange=()=>showTrace(+$('#traceSelect').value);showTrace(+$('#traceSelect').value||0)}function showTrace(i){let tr=DATA.traces[i];$('#traceView').innerHTML=tr.steps.map((s,j)=>`${j?'<span class="arrow">→</span>':''}<div class="step" data-file="${esc(s[1])}" data-line="${s[2]}"><strong>${j+1}</strong> ${esc(s[0])}<div style="font:10px var(--mono);color:#80879f">${esc(s[1])}:${s[2]}</div></div>`).join('');$('#traceNote').textContent=lang==='ja'?'各stepを押すと担当コードへ移動します。':'Click any step to jump to the responsible code.';$$('.step').forEach(x=>x.onclick=()=>{selectFile(x.dataset.file,+x.dataset.line);switchView('explore')})}
function renderDash(){let ds=allDrills(),mastered=ds.filter(d=>{try{return(JSON.parse(STORE.get('asl3:'+d.id))||{}).best>=3}catch{return false}}).length;let by=DATA.files.map(f=>{let x=drillsForFile(f),m=x.filter(d=>{try{return(JSON.parse(STORE.get('asl3:'+d.id))||{}).best>=3}catch{return false}}).length;return `<tr><td>${esc(f.name)}</td><td>${x.length}</td><td>${m}</td><td><div class="progressbar"><span style="width:${x.length?m/x.length*100:0}%"></span></div></td></tr>`}).join('');$('#dash').innerHTML=`<h1 class="section-title">${t('dashboardTitle')}</h1><p class="lead">${t('dashLead')}</p><div class="cards"><div class="card"><div class="label">Files</div><div class="big">14</div></div><div class="card"><div class="label">Logical blocks</div><div class="big">${DATA.stats.blocks}</div></div><div class="card"><div class="label">Micro drills</div><div class="big">${ds.length}</div></div><div class="card"><div class="label">Mastered drills</div><div class="big">${mastered}/${ds.length}</div></div><div class="card"><div class="label">ROSE MCQ</div><div class="big">${roseScore()[0]}/${ROSE.length}</div></div></div><div class="card" style="padding:0;overflow:auto"><table class="blocktable"><thead><tr><th>File</th><th>Micro drills</th><th>Mastered</th><th>Progress</th></tr></thead><tbody>${by}</tbody></table></div>`}
applyLang();renderNav();renderFile();renderBlocks();renderWhy();drill=drillsForFile(current)[0];renderQuizControls();renderQuiz();renderRose();renderTrace();renderDash();
</script></body></html>
